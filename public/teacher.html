<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher — Attendance</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h1>Start a class session</h1>
  <p class="subtitle">The QR rotates every 10s and only counts inside the classroom radius.
    <a href="history.html" style="color:var(--accent);">View past sessions →</a></p>

  <div id="setup" class="card">
    <label for="subject">Subject</label>
    <input id="subject" placeholder="e.g. CS301 — Operating Systems" />

    <label for="teacherName">Your name</label>
    <input id="teacherName" placeholder="e.g. Prof. Rao" />

    <div class="row">
      <div>
        <label for="radius">Geofence radius (m)</label>
        <input id="radius" type="number" placeholder="30" />
      </div>
      <div>
        <label for="duration">Duration (min)</label>
        <input id="duration" type="number" placeholder="55" />
      </div>
    </div>

    <label for="roster">Enrolled roll numbers (optional)</label>
    <textarea id="roster" placeholder="One per line or comma-separated, e.g.&#10;21CS001, 21CS002, 21CS003&#10;&#10;Leave blank to accept any roll number."></textarea>

    <button id="capture-loc" class="secondary">📍 Capture classroom location — stand in the room, then tap</button>
    <div id="loc-status" class="msg info" style="display:none;"></div>

    <button id="start-btn" disabled>Start session</button>
  </div>

  <div id="live" style="display:none;">
    <div class="card">
      <div class="row" style="align-items:flex-start;">
        <div>
          <h1 id="subject-title" style="margin-bottom:2px;"></h1>
          <span class="badge neutral" id="radius-badge"></span>
          <span class="badge neutral" id="roster-badge"></span>
          <span class="badge warn" id="end-time-badge"></span>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button id="extend-btn" class="secondary" style="margin-top:0;">+5 min</button>
          <button id="end-btn" class="danger" style="margin-top:0;">End session</button>
        </div>
      </div>

      <div id="qr-box">
        <canvas id="qr-canvas"></canvas>
        <div class="timer-ring" id="timer-ring" style="--pct:100;">
          <div class="timer-inner"><span id="timer">10</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="stat-row">
        <div class="stat">
          <div class="num" id="count">0</div>
          <div class="label" id="count-label">Present</div>
        </div>
        <div class="stat">
          <div class="num" id="flagged-count">0</div>
          <div class="label">Flagged attempts</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Present</h2>
      <ul id="present-list" class="list"><li class="empty">No one has scanned in yet.</li></ul>
    </div>

    <div class="card">
      <h2>Flagged attempts</h2>
      <ul id="flagged-list" class="list"><li class="empty">Nothing flagged yet.</li></ul>
    </div>
  </div>

  <script>
    let lat = null, lng = null, sessionId = null, windowSeconds = 10, rosterSize = 0, sessionEndTime = null;

    // Pushes an instant refresh the moment a student is marked present or
    // flagged, instead of waiting for the next poll (up to 3s away). Polling
    // stays in place underneath as a fallback if the socket ever drops.
    const socket = io();
    socket.on('present', () => { if (sessionId) refreshList(); });
    socket.on('flagged', () => { if (sessionId) refreshFlagged(); });
    // Room membership doesn't survive a dropped connection — rejoin whenever
    // the socket (re)connects, not just on the first "start session" click.
    socket.on('connect', () => { if (sessionId) socket.emit('join', sessionId); });

    function renderEndTimeBadge() {
      if (!sessionEndTime) return;
      document.getElementById('end-time-badge').textContent =
        `⏱ Ends ${sessionEndTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    }

    const reasonLabel = {
      outside_geofence: 'Outside classroom',
      device_mismatch: 'Device mismatch',
      not_enrolled: 'Not enrolled',
    };

    // Roll numbers and names are student-supplied and rendered via innerHTML,
    // so they have to be escaped or a crafted name runs script in this panel.
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    document.getElementById('capture-loc').onclick = () => {
      const el = document.getElementById('loc-status');
      el.style.display = 'block';
      el.className = 'msg info';
      el.textContent = 'Locating...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          lat = pos.coords.latitude;
          lng = pos.coords.longitude;
          el.className = 'msg ok';
          el.textContent = `Captured: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          document.getElementById('start-btn').disabled = false;
        },
        (err) => {
          el.className = 'msg err';
          el.textContent = 'Location failed: ' + err.message;
        },
        { enableHighAccuracy: true }
      );
    };

    document.getElementById('start-btn').onclick = async () => {
      const subject = document.getElementById('subject').value.trim();
      const teacherName = document.getElementById('teacherName').value.trim();
      const radiusMeters = Number(document.getElementById('radius').value) || 30;
      const durationMinutes = Number(document.getElementById('duration').value) || 55;
      const roster = document.getElementById('roster').value
        .split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);

      if (!subject || !teacherName) { alert('Subject and name are required'); return; }

      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, teacherName, lat, lng, radiusMeters, durationMinutes, roster }),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); return; }

      enterLiveMode(data);
    };

    // Shared by "start session" and by the restore-after-refresh path below,
    // so a reloaded tab picks the running session back up instead of
    // orphaning it (the id used to live only in this variable).
    function enterLiveMode(data) {
      sessionId = data.sessionId;
      windowSeconds = data.windowSeconds;
      rosterSize = data.rosterSize;
      sessionEndTime = new Date(data.endTime);
      localStorage.setItem('active_session', sessionId);
      socket.emit('join', sessionId);

      document.getElementById('subject-title').textContent = data.subject;
      document.getElementById('radius-badge').textContent = `📍 ${data.classroom.radiusMeters}m radius`;
      document.getElementById('roster-badge').textContent = rosterSize > 0 ? `👥 ${rosterSize} enrolled` : '👥 open roster';
      document.getElementById('count-label').textContent = rosterSize > 0 ? `Present / ${rosterSize}` : 'Present';
      renderEndTimeBadge();

      document.getElementById('setup').style.display = 'none';
      document.getElementById('live').style.display = 'block';

      refreshQR();
      setInterval(refreshQR, 1000);
      refreshList();
      setInterval(refreshList, 3000);
      refreshFlagged();
      setInterval(refreshFlagged, 3000);
    }

    async function restoreSession() {
      const savedId = localStorage.getItem('active_session');
      if (!savedId) return;

      try {
        const res = await fetch(`/api/sessions/${savedId}`);
        if (!res.ok) throw new Error('gone');
        const data = await res.json();
        if (!data.active || new Date(data.endTime) <= new Date()) throw new Error('ended');
        enterLiveMode(data);
      } catch {
        localStorage.removeItem('active_session');
      }
    }

    document.getElementById('extend-btn').onclick = async () => {
      const btn = document.getElementById('extend-btn');
      btn.disabled = true;
      const res = await fetch(`/api/sessions/${sessionId}/extend`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ minutes: 5 }),
      });
      const data = await res.json();
      btn.disabled = false;
      if (!res.ok) { alert(data.error); return; }
      sessionEndTime = new Date(data.endTime);
      renderEndTimeBadge();
    };

    document.getElementById('end-btn').onclick = async () => {
      if (!confirm('End this session? Students will no longer be able to mark attendance.')) return;
      await fetch(`/api/sessions/${sessionId}/end`, { method: 'POST' });
      localStorage.removeItem('active_session');
      alert('Session ended.');
      location.reload();
    };

    async function refreshQR() {
      const res = await fetch(`/api/sessions/${sessionId}/current-qr`);
      const data = await res.json();
      if (!res.ok) { document.getElementById('timer').textContent = '—'; return; }

      const canvas = document.getElementById('qr-canvas');
      QRCode.toCanvas(canvas, data.payload, { width: 220 });

      const secondsLeft = Math.ceil(data.msLeftInWindow / 1000);
      document.getElementById('timer').textContent = secondsLeft + 's';
      const pct = Math.round((data.msLeftInWindow / (windowSeconds * 1000)) * 100);
      document.getElementById('timer-ring').style.setProperty('--pct', pct);
    }

    async function refreshList() {
      const res = await fetch(`/api/sessions/${sessionId}/attendance`);
      const records = await res.json();
      document.getElementById('count').textContent = records.length;
      const ul = document.getElementById('present-list');
      if (records.length === 0) {
        ul.innerHTML = '<li class="empty">No one has scanned in yet.</li>';
        return;
      }
      ul.innerHTML = records.map((r) => `
        <li>
          <span class="who">${esc(r.student.rollNo)} — ${esc(r.student.name)}
            <span class="badge neutral">${Math.round(r.distanceMeters)}m${r.accuracyMeters != null ? ` ±${Math.round(r.accuracyMeters)}m` : ''}</span>
            ${r.borderline ? '<span class="badge warn">borderline</span>' : ''}
          </span>
          <span class="when">${new Date(r.markedAt).toLocaleTimeString()}</span>
        </li>
      `).join('');
    }

    async function refreshFlagged() {
      const res = await fetch(`/api/sessions/${sessionId}/flagged`);
      const flags = await res.json();
      document.getElementById('flagged-count').textContent = flags.length;
      const ul = document.getElementById('flagged-list');
      if (flags.length === 0) {
        ul.innerHTML = '<li class="empty">Nothing flagged yet.</li>';
        return;
      }
      ul.innerHTML = flags.map((f) => `
        <li>
          <span>
            <span class="badge err">${esc(reasonLabel[f.reason] || f.reason)}</span>
            <span class="who">${esc(f.rollNo)}</span> — ${esc(f.detail)}${f.accuracyMeters != null ? ` (GPS ±${Math.round(f.accuracyMeters)}m)` : ''}
          </span>
          <span class="when">${new Date(f.createdAt).toLocaleTimeString()}</span>
        </li>
      `).join('');
    }

    restoreSession();
  </script>
</body>
</html>
