<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<link rel="stylesheet" href="style.css" />
<script src="auth-client.js"></script>
</head>
<body>
  <h1>Sign in</h1>
  <p class="subtitle">Use your @rajalakshmi.edu.in email. Staff go to the teacher panel automatically, everyone else to the student page.</p>

  <div class="card">
    <input type="email" id="email" placeholder="yourname@rajalakshmi.edu.in" autocomplete="email" />
    <button id="signin-btn" style="margin-top:12px;">Sign in</button>
    <div id="signin-status" class="msg info" style="display:none; margin-top:12px;"></div>
  </div>

  <p class="footer-note"><a href="index.html" style="color:var(--text-dim);">← Back</a></p>

  <script>
    function redirectByRole(role) {
      location.href = role === 'staff' ? 'teacher.html' : 'student.html';
    }

    const existing = getAuth();
    if (existing) redirectByRole(existing.role);

    async function signIn() {
      const status = document.getElementById('signin-status');
      const email = document.getElementById('email').value.trim();
      status.style.display = 'block';
      status.className = 'msg info';
      status.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign-in failed');

        localStorage.setItem(AUTH_KEY, JSON.stringify(data));
        status.className = 'msg ok';
        status.textContent = `Signed in as ${data.name} (${data.role}) — redirecting...`;
        setTimeout(() => redirectByRole(data.role), 500);
      } catch (err) {
        status.className = 'msg err';
        status.textContent = err.message;
      }
    }

    document.getElementById('signin-btn').onclick = signIn;
    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signIn();
    });
  </script>
</body>
</html>
