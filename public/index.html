<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sign in — Smart Attendance</title>
<meta name="theme-color" content="#0b0d12" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Attendance" />
<link rel="stylesheet" href="style.css" />
<script src="auth-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Smart Attendance</h1>
  <p class="subtitle">Rotating QR + GPS geofence + device binding + roster enforcement + verified sign-in.</p>

  <div class="card">
    <!-- Google's button is a cross-origin iframe we can't reach inside — under
         some navigation paths (e.g. a session-expired redirect) it renders an
         extra personalized row stacked below the normal one. Clipping the
         container to exactly one button's height hides that regardless of
         what Google decides to render, without touching iframe internals. -->
    <div id="google-btn" style="height:40px; overflow:hidden;"></div>

    <div id="fallback" style="display:none;">
      <p class="msg info" style="margin-bottom:12px;">Google sign-in isn't configured yet — using unverified typed-email sign-in for now.</p>
      <input type="email" id="email" placeholder="college_id" autocomplete="email" />
      <button id="signin-btn" style="margin-top:12px;">Sign in</button>
    </div>

    <div id="signin-status" class="msg info" style="display:none; margin-top:12px;"></div>
  </div>

  <script>
    // Only ever hands back a same-page relative link we ourselves generated
    // (student.html?p=...) — never an arbitrary external URL — so a crafted
    // ?next= can't be used to redirect a freshly-authenticated student off-site.
    function safeNext() {
      const next = new URLSearchParams(location.search).get('next');
      return next && next.startsWith('student.html') ? next : null;
    }

    function redirectByRole(role) {
      const next = safeNext();
      if (next && role !== 'staff' && role !== 'admin') { location.href = next; return; }
      location.href = (role === 'staff' || role === 'admin') ? 'teacher.html' : 'student.html';
    }

    const existing = getAuth();
    if (existing) redirectByRole(existing.role);

    async function completeLogin(body) {
      const status = document.getElementById('signin-status');
      status.style.display = 'block';
      status.className = 'msg info';
      status.textContent = 'Signing in...';

      try {
        // On slow mobile data this would otherwise hang with the "Signing
        // in..." message stuck forever and no way to tell what's wrong.
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        let res;
        try {
          res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
        } catch (err) {
          throw new Error(err.name === 'AbortError' ? 'Network is too slow right now — check your connection and try again.' : 'Could not reach the server — check your connection and try again.');
        } finally {
          clearTimeout(timer);
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign-in failed');

        localStorage.setItem(AUTH_KEY, JSON.stringify(data));
        status.className = 'msg ok';
        status.textContent = `Signed in as ${data.name} (${data.role}) — redirecting...`;
        setTimeout(() => redirectByRole(data.role), 500);
      } catch (err) {
        status.className = 'msg err';
        status.textContent = err.message;
      }
    }

    // The GSI script tag is async/defer — on a slow connection it can still
    // be loading by the time this runs, so give it a moment rather than
    // falling back to the (unverified) typed-email form unnecessarily.
    function waitForGoogle(timeoutMs) {
      return new Promise((resolve) => {
        const start = Date.now();
        (function poll() {
          if (window.google) return resolve(true);
          if (Date.now() - start > timeoutMs) return resolve(false);
          setTimeout(poll, 100);
        })();
      });
    }

    (async function init() {
      const { googleClientId } = await fetch('/api/auth/config').then((r) => r.json());
      const googleReady = googleClientId ? await waitForGoogle(3000) : false;

      if (googleClientId && googleReady) {
        // cancel() clears any One Tap prompt state GSI may have carried over
        // from elsewhere in this browser session — without it, arriving here
        // via a client-side redirect (e.g. an expired-session bounce from
        // student.html) can show both our button AND a leftover GSI auto
        // prompt stacked on top of each other.
        if (google.accounts.id.cancel) google.accounts.id.cancel();
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: (response) => completeLogin({ credential: response.credential }),
          auto_select: false,
          cancel_on_tap_outside: true,
        });
        const btnContainer = document.getElementById('google-btn');
        btnContainer.innerHTML = '';
        google.accounts.id.renderButton(btnContainer, { theme: 'outline', size: 'large' });
      } else {
        document.getElementById('fallback').style.display = 'block';
        document.getElementById('signin-btn').onclick = () => {
          completeLogin({ email: document.getElementById('email').value.trim() });
        };
        document.getElementById('email').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.getElementById('signin-btn').click();
        });
      }
    })();
  </script>
</body>
</html>
