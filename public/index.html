<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance</title>
<link rel="stylesheet" href="style.css" />
<script src="auth-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Smart Attendance</h1>
  <p class="subtitle">Rotating QR + GPS geofence + device binding + roster enforcement + verified sign-in.</p>

  <div class="card">
    <div id="google-btn"></div>

    <div id="fallback" style="display:none;">
      <p class="msg info" style="margin-bottom:12px;">Google sign-in isn't configured yet — using unverified typed-email sign-in for now.</p>
      <input type="email" id="email" placeholder="college_id" autocomplete="email" />
      <button id="signin-btn" style="margin-top:12px;">Sign in</button>
    </div>

    <div id="signin-status" class="msg info" style="display:none; margin-top:12px;"></div>
  </div>

  <script>
    function redirectByRole(role) {
      location.href = (role === 'staff' || role === 'admin') ? 'teacher.html' : 'student.html';
    }

    const existing = getAuth();
    if (existing) redirectByRole(existing.role);

    async function completeLogin(body) {
      const status = document.getElementById('signin-status');
      status.style.display = 'block';
      status.className = 'msg info';
      status.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign-in failed');

        localStorage.setItem(AUTH_KEY, JSON.stringify(data));
        status.className = 'msg ok';
        status.textContent = `Signed in as ${data.name} (${data.role}) — redirecting...`;
        setTimeout(() => redirectByRole(data.role), 500);
      } catch (err) {
        status.className = 'msg err';
        status.textContent = err.message;
      }
    }

    // The GSI script tag is async/defer — on a slow connection it can still
    // be loading by the time this runs, so give it a moment rather than
    // falling back to the (unverified) typed-email form unnecessarily.
    function waitForGoogle(timeoutMs) {
      return new Promise((resolve) => {
        const start = Date.now();
        (function poll() {
          if (window.google) return resolve(true);
          if (Date.now() - start > timeoutMs) return resolve(false);
          setTimeout(poll, 100);
        })();
      });
    }

    (async function init() {
      const { googleClientId } = await fetch('/api/auth/config').then((r) => r.json());
      const googleReady = googleClientId ? await waitForGoogle(3000) : false;

      if (googleClientId && googleReady) {
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: (response) => completeLogin({ credential: response.credential }),
        });
        const btnContainer = document.getElementById('google-btn');
        btnContainer.innerHTML = ''; // GSI can leave a stale/duplicate prompt behind depending on navigation history — always render into a clean container
        google.accounts.id.renderButton(btnContainer, { theme: 'outline', size: 'large' });
      } else {
        document.getElementById('fallback').style.display = 'block';
        document.getElementById('signin-btn').onclick = () => {
          completeLogin({ email: document.getElementById('email').value.trim() });
        };
        document.getElementById('email').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.getElementById('signin-btn').click();
        });
      }
    })();
  </script>
</body>
</html>
