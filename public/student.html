<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student — Mark Attendance</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <h1>Mark attendance</h1>
  <p class="subtitle">Scan the QR shown in class. You must be physically in the room — the code checks your location too.</p>

  <div class="card">
    <label for="rollNo">Roll number</label>
    <input id="rollNo" placeholder="e.g. 21CS001" autocomplete="off" />

    <label for="name">Full name</label>
    <input id="name" placeholder="e.g. Jane Doe" autocomplete="off" />

    <button id="scan-btn">Scan classroom QR</button>

    <div class="reader-frame" id="reader-frame" style="display:none;">
      <div id="reader"></div>
    </div>

    <label for="qr-file" style="margin-top:14px;">No camera? Upload a photo/screenshot of the QR instead</label>
    <input type="file" id="qr-file" accept="image/*" />

    <div id="result"></div>
  </div>

  <p class="footer-note">Protected by rotating token + GPS geofence + device binding</p>

  <script>
    // Device id derived from stable browser/hardware signals (canvas render +
    // navigator/screen properties) instead of a random UUID, so clearing
    // localStorage/private-window no longer resets a student's binding.
    // ponytail: still a browser fingerprint, not a hardware ID — a different
    // browser or a fingerprint-spoofing extension still gets a new id. Real
    // hardware ID (Android/iOS) needs a native app; see Phase 2.
    async function getDeviceId() {
      const cached = localStorage.getItem('device_id');
      if (cached) return cached;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('device-fingerprint', 2, 2);
      const canvasData = canvas.toDataURL();

      const raw = [
        navigator.userAgent,
        navigator.hardwareConcurrency,
        navigator.language,
        screen.width, screen.height, screen.colorDepth,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvasData,
      ].join('|');

      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      const id = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');

      localStorage.setItem('device_id', id);
      return id;
    }

    let scanner = null;

    function setBusy(busy, label) {
      const btn = document.getElementById('scan-btn');
      btn.disabled = busy;
      btn.innerHTML = busy ? `<span class="spinner"></span>${label}` : 'Scan classroom QR';
    }

    document.getElementById('scan-btn').onclick = () => {
      const rollNo = document.getElementById('rollNo').value.trim();
      const name = document.getElementById('name').value.trim();
      if (!rollNo || !name) { showMsg('Enter your roll number and name first.', false); return; }

      setBusy(true, 'Opening camera...');
      document.getElementById('reader-frame').style.display = 'block';
      document.getElementById('result').innerHTML = '';

      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },
        async (decodedText) => {
          await scanner.stop();
          scanner.clear();
          document.getElementById('reader-frame').style.display = 'none';
          handleScan(decodedText, rollNo, name);
        },
        () => {} // ignore per-frame scan failures
      ).catch((err) => {
        document.getElementById('reader-frame').style.display = 'none';
        showMsg('Could not access camera: ' + (err && err.message ? err.message : err), false);
        setBusy(false);
      });
    };

    document.getElementById('qr-file').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const rollNo = document.getElementById('rollNo').value.trim();
      const name = document.getElementById('name').value.trim();
      if (!rollNo || !name) { showMsg('Enter your roll number and name first.', false); e.target.value = ''; return; }

      setBusy(true, 'Reading QR image...');
      document.getElementById('result').innerHTML = '';
      const fileScanner = new Html5Qrcode('reader');
      try {
        const decodedText = await fileScanner.scanFile(file, false);
        handleScan(decodedText, rollNo, name);
      } catch (err) {
        showMsg('Could not read a QR code from that image: ' + (err && err.message ? err.message : err), false);
        setBusy(false);
      }
      e.target.value = '';
    };

    function showMsg(text, ok) {
      const div = document.getElementById('result');
      div.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
    }

    // "Take one reading and keep it" throws away information — each new GPS
    // fix says something about where you are even if it's noisy. A Kalman
    // filter fuses every sample into a running estimate instead: each fix is
    // weighted by its own reported accuracy (a confident fix pulls the
    // estimate hard, a noisy one barely moves it), and uncertainty grows
    // between fixes based on how much a person could plausibly have moved.
    // This is the standard technique for exactly this problem — the same
    // approach used by e.g. mobile fitness/tracking apps to smooth raw GPS.
    function haversineApprox(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    class KalmanLocationFilter {
      // processNoise: meters/sec of plausible movement, i.e. how fast our
      // confidence should erode between fixes. A slow walk, not a car.
      constructor(processNoise = 3) {
        this.variance = -1;
        this.processNoise = processNoise;
      }
      process(lat, lng, accuracy, timestampMs) {
        const acc = Math.max(accuracy, 1); // a reported 0m accuracy is not real
        if (this.variance < 0) {
          this.timestamp = timestampMs;
          this.lat = lat;
          this.lng = lng;
          this.variance = acc * acc;
        } else {
          const dtSeconds = Math.max(0, (timestampMs - this.timestamp) / 1000);

          // A jump wildly bigger than what either reading's own claimed
          // accuracy could plausibly explain (a stray multipath reflection,
          // not real movement or ordinary noise) is discarded outright — a
          // Kalman filter otherwise still lets one bad sample drag the
          // estimate a long way before it recovers. Gated on the readings'
          // own uncertainty rather than an assumed speed, since a flat speed
          // threshold is fragile: how far apart two noisy-but-valid fixes
          // land depends on the device's polling interval, not just how fast
          // someone could move — a threshold tuned for 1.5s-apart fixes can
          // misfire on fixes 0.5s apart even with no outlier involved.
          if (dtSeconds > 0) {
            const jumpMeters = haversineApprox(this.lat, this.lng, lat, lng);
            const priorAccuracy = Math.sqrt(this.variance);
            const plausibleAllowance = 3 * (priorAccuracy + acc) + this.processNoise * dtSeconds;
            if (jumpMeters > plausibleAllowance) {
              return { lat: this.lat, lng: this.lng, accuracy: Math.sqrt(this.variance) };
            }
          }

          this.timestamp = timestampMs;
          this.variance += dtSeconds * this.processNoise * this.processNoise; // uncertainty grows with time since last fix
          const gain = this.variance / (this.variance + acc * acc);
          this.lat += gain * (lat - this.lat);
          this.lng += gain * (lng - this.lng);
          this.variance = (1 - gain) * this.variance;
        }
        return { lat: this.lat, lng: this.lng, accuracy: Math.sqrt(this.variance) };
      }
    }

    // Samples for a few seconds, running every fix through the filter above,
    // instead of a single getCurrentPosition() call — which on many phones
    // returns the first fix, commonly the least accurate one (cached/
    // network-based, before the GPS chip has warmed up).
    function getFilteredPosition(onProgress) {
      return new Promise((resolve, reject) => {
        const GOOD_ENOUGH_METERS = 12;
        const TIMEOUT_MS = 5000;
        const filter = new KalmanLocationFilter();
        let latest = null;
        let gotAnyFix = false;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            gotAnyFix = true;
            latest = filter.process(
              pos.coords.latitude,
              pos.coords.longitude,
              pos.coords.accuracy,
              pos.timestamp || Date.now()
            );
            if (onProgress) onProgress(latest.accuracy);
            if (latest.accuracy <= GOOD_ENOUGH_METERS) finish();
          },
          (err) => { if (gotAnyFix) finish(); else { cleanup(); reject(err); } },
          { enableHighAccuracy: true, maximumAge: 0 }
        );

        const timer = setTimeout(finish, TIMEOUT_MS);
        function cleanup() { clearTimeout(timer); navigator.geolocation.clearWatch(watchId); }
        function finish() {
          cleanup();
          if (latest) resolve(latest); else reject(new Error('Could not get a location fix'));
        }
      });
    }

    function handleScan(payload, rollNo, name) {
      if (!navigator.geolocation) { showMsg('Geolocation not supported on this device.', false); setBusy(false); return; }

      setBusy(true, 'Getting GPS fix...');
      getFilteredPosition((acc) => setBusy(true, `Refining GPS fix (~${Math.round(acc)}m)...`))
        .then(async (pos) => {
          setBusy(true, `Verifying (GPS accuracy ~${Math.round(pos.accuracy)}m)...`);
          const body = {
            payload,
            rollNo,
            name,
            lat: pos.lat,
            lng: pos.lng,
            accuracy: pos.accuracy,
            deviceId: await getDeviceId(),
          };
          const res = await fetch('/api/attendance/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          setBusy(false);
          if (res.ok) {
            const note = data.borderline
              ? ' — near the edge of the detection radius, flagged for teacher review.'
              : '.';
            showMsg(`✓ Marked present — ~${data.distanceMeters}m from classroom center (GPS accuracy ~${Math.round(data.accuracyMeters)}m)${note}`, true);
          } else {
            showMsg(data.error, false);
          }
        })
        .catch((err) => {
          showMsg('Location permission is required: ' + err.message, false);
          setBusy(false);
        });
    }
  </script>
</body>
</html>
