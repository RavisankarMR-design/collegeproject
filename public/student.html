<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student — Mark Attendance</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="geo-filter.js"></script>
<script src="auth-client.js"></script>
</head>
<body>
  <h1>Mark attendance</h1>
  <p class="subtitle">Scan the QR shown in class. You must be physically in the room — the code checks your location too.
    <span id="signed-in-as" style="display:block; margin-top:4px;"></span>
  </p>

  <div class="card">
    <label for="rollNo">Roll number</label>
    <input id="rollNo" placeholder="e.g. 240701424" autocomplete="off" inputmode="numeric" maxlength="9" />

    <button id="scan-btn">Scan classroom QR</button>

    <div class="reader-frame" id="reader-frame" style="display:none;">
      <div id="reader"></div>
    </div>

    <label for="qr-file" style="margin-top:14px;">No camera? Upload a photo/screenshot of the QR instead</label>
    <input type="file" id="qr-file" accept="image/*" />

    <p class="footer-note" style="margin-top:10px;">
      <a href="#" id="code-toggle-link" style="color:var(--accent);">Can't scan the QR? Enter the code instead</a>
    </p>

    <div id="code-entry" style="display:none; margin-top:10px;">
      <label for="fallbackCode">Code from the teacher's screen (changes every 10s)</label>
      <input id="fallbackCode" placeholder="e.g. K7Q3RT 4821" style="text-transform:uppercase; letter-spacing:1px;" autocomplete="off" />
      <button id="code-submit-btn" style="margin-top:10px;">Submit code</button>
    </div>

    <div id="result"></div>
  </div>

  <p class="footer-note">Protected by rotating token + GPS geofence + device binding</p>

  <script>
    const auth = requireSignedIn();
    if (auth) {
      const adminLinks = auth.role === 'admin'
        ? ' · <a href="teacher.html" style="color:var(--accent);">Teacher page</a> · <a href="history.html" style="color:var(--accent);">History</a>'
        : '';
      document.getElementById('signed-in-as').innerHTML =
        `Signed in as ${auth.name} (${auth.email}) — <a href="#" id="sign-out-link" style="color:var(--text-dim);">sign out</a>${adminLinks}`;
      document.getElementById('sign-out-link').onclick = (e) => { e.preventDefault(); signOut(); };
    }

    // Device id derived from stable browser/hardware signals (canvas render +
    // navigator/screen properties) instead of a random UUID, so clearing
    // localStorage/private-window no longer resets a student's binding.
    // ponytail: still a browser fingerprint, not a hardware ID — a different
    // browser or a fingerprint-spoofing extension still gets a new id. Real
    // hardware ID (Android/iOS) needs a native app; see Phase 2.
    async function getDeviceId() {
      const cached = localStorage.getItem('device_id');
      if (cached) return cached;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('device-fingerprint', 2, 2);
      const canvasData = canvas.toDataURL();

      const raw = [
        navigator.userAgent,
        navigator.hardwareConcurrency,
        navigator.language,
        screen.width, screen.height, screen.colorDepth,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvasData,
      ].join('|');

      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      const id = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');

      localStorage.setItem('device_id', id);
      return id;
    }

    let scanner = null;

    let busyBtnId = 'scan-btn';
    const busyBtnLabel = { 'scan-btn': 'Scan classroom QR', 'code-submit-btn': 'Submit code' };
    function setBusy(busy, label) {
      const btn = document.getElementById(busyBtnId);
      btn.disabled = busy;
      btn.innerHTML = busy ? `<span class="spinner"></span>${label}` : busyBtnLabel[busyBtnId];
    }

    document.getElementById('code-toggle-link').onclick = (e) => {
      e.preventDefault();
      const entry = document.getElementById('code-entry');
      const isHidden = entry.style.display === 'none';
      entry.style.display = isHidden ? 'block' : 'none';
      e.target.textContent = isHidden ? 'Scan the QR instead' : "Can't scan the QR? Enter the code instead";
    };

    document.getElementById('code-submit-btn').onclick = () => {
      const rollNo = document.getElementById('rollNo').value.trim();
      if (!rollNo) { showMsg('Enter your roll number first.', false); return; }
      if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24070 followed by 4 digits (e.g. 240701424).', false); return; }

      // Teacher's screen shows "K7Q3RT 4821" as one string — split on
      // whitespace so students paste/type it as a single code, while the
      // server still needs both parts separately (see routes/attendance.js).
      const parts = document.getElementById('fallbackCode').value.trim().toUpperCase().split(/\s+/);
      const sessionCode = parts[0] || '';
      const code = parts[1] || '';
      if (!sessionCode || !code) { showMsg('Enter the full code shown on the teacher\'s screen (both parts).', false); return; }

      busyBtnId = 'code-submit-btn';
      document.getElementById('result').innerHTML = '';
      handleScan({ sessionCode, code }, rollNo);
    };

    // Keep in sync with the server-side check in routes/attendance.js (search
    // "Wrong roll number format") — this is just a fast client-side pre-check,
    // the server enforces the real rule.
    function validRollNo(rollNo) {
      if (auth && auth.role === 'admin') return true; // admin uses arbitrary test values
      return /^24070\d{4}$/.test(rollNo);
    }

    document.getElementById('scan-btn').onclick = () => {
      const rollNo = document.getElementById('rollNo').value.trim();
      if (!rollNo) { showMsg('Enter your roll number first.', false); return; }
      if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24070 followed by 4 digits (e.g. 240701424).', false); return; }

      busyBtnId = 'scan-btn';
      setBusy(true, 'Opening camera...');
      document.getElementById('reader-frame').style.display = 'block';
      document.getElementById('result').innerHTML = '';

      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },
        async (decodedText) => {
          await scanner.stop();
          scanner.clear();
          document.getElementById('reader-frame').style.display = 'none';
          handleScan({ payload: decodedText }, rollNo);
        },
        () => {} // ignore per-frame scan failures
      ).catch((err) => {
        document.getElementById('reader-frame').style.display = 'none';
        showMsg('Could not access camera: ' + (err && err.message ? err.message : err), false);
        setBusy(false);
      });
    };

    document.getElementById('qr-file').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const rollNo = document.getElementById('rollNo').value.trim();
      if (!rollNo) { showMsg('Enter your roll number first.', false); e.target.value = ''; return; }
      if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24070 followed by 4 digits (e.g. 240701424).', false); e.target.value = ''; return; }

      busyBtnId = 'scan-btn';
      setBusy(true, 'Reading QR image...');
      document.getElementById('result').innerHTML = '';
      const fileScanner = new Html5Qrcode('reader');
      try {
        const decodedText = await fileScanner.scanFile(file, false);
        handleScan({ payload: decodedText }, rollNo);
      } catch (err) {
        showMsg('Could not read a QR code from that image: ' + (err && err.message ? err.message : err), false);
        setBusy(false);
      }
      e.target.value = '';
    };

    function showMsg(text, ok) {
      const div = document.getElementById('result');
      div.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
    }

    // A roll number typo only gets one free silent auto-correction server-side
    // (see routes/attendance.js) — after that it's locked and needs staff to
    // release it. Catching the typo here, before it ever reaches the server,
    // means an honest mistake doesn't burn that one free correction.
    function confirmRollChange(rollNo) {
      const lastRoll = localStorage.getItem('last_roll_no');
      if (lastRoll && lastRoll !== rollNo) {
        return confirm(`You last scanned in with roll number ${lastRoll}. Submit ${rollNo} instead?\n\nOnly pick "OK" if ${lastRoll} was a typo — you only get one free correction, after that a staff member has to release it.`);
      }
      return true;
    }

    function handleScan(identity, rollNo) {
      if (!confirmRollChange(rollNo)) { setBusy(false); return; }
      if (!navigator.geolocation) { showMsg('Geolocation not supported on this device.', false); setBusy(false); return; }

      setBusy(true, 'Getting GPS fix...');
      getFilteredPosition((acc) => setBusy(true, `Refining GPS fix (~${Math.round(acc)}m)...`))
        .then(async (pos) => {
          setBusy(true, `Verifying (GPS accuracy ~${Math.round(pos.accuracy)}m)...`);
          const body = {
            ...identity,
            rollNo,
            lat: pos.lat,
            lng: pos.lng,
            accuracy: pos.accuracy,
            deviceId: await getDeviceId(),
          };
          const res = await authFetch('/api/attendance/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          setBusy(false);
          if (res.ok) {
            localStorage.setItem('last_roll_no', rollNo);
            const note = data.borderline
              ? ' — near the edge of the detection radius, flagged for teacher review.'
              : '.';
            showMsg(`✓ Marked present — ~${data.distanceMeters}m from classroom center (GPS accuracy ~${Math.round(data.accuracyMeters)}m)${note}`, true);
          } else {
            showMsg(data.error, false);
          }
        })
        .catch((err) => {
          // err.code === 1 is GeolocationPositionError.PERMISSION_DENIED —
          // only that specific case is actually about permission. Labeling
          // every failure (weak signal, GPS momentarily unavailable, our own
          // retry budget running out) as a permission problem sends students
          // to the wrong settings screen.
          const msg = err.code === 1 ? 'Location permission is required: ' + err.message : err.message;
          showMsg(msg, false);
          setBusy(false);
        });
    }
  </script>
</body>
</html>
