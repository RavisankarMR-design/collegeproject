<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student — Mark Attendance</title>
<link rel="stylesheet" href="style.css" />
<script src="vendor/html5-qrcode.min.js"></script>
<script src="geo-filter.js"></script>
<script src="auth-client.js"></script>
</head>
<body>
  <h1>Mark attendance</h1>
  <p class="subtitle">Scan the QR shown in class. You must be physically in the room — the code checks your location too.
    <span id="signed-in-as" style="display:block; margin-top:4px;"></span>
  </p>

  <div class="card">
    <label for="rollNo">Roll number</label>
    <input id="rollNo" placeholder="e.g. 240701424" autocomplete="off" inputmode="numeric" maxlength="9" />

    <button id="scan-btn">Scan classroom QR</button>

    <div class="reader-frame" id="reader-frame" style="display:none;">
      <div id="reader"></div>
    </div>

    <p class="footer-note" style="margin-top:10px;">
      <a href="#" id="code-toggle-link" style="color:var(--accent);">Can't scan the QR? Enter the code instead</a>
    </p>

    <div id="code-entry" style="display:none; margin-top:10px;">
      <label for="liveCode">Live code (from the teacher's screen, changes every 10s)</label>
      <input id="liveCode" placeholder="e.g. 4821" maxlength="4" inputmode="numeric" autocomplete="off" style="letter-spacing:2px;" />
      <button id="code-submit-btn" style="margin-top:10px;">Submit code</button>
    </div>

    <div id="result"></div>
  </div>

  <p class="footer-note">Protected by rotating token + GPS geofence + device binding</p>

  <script>
    // A QR scanned straight from the phone's own camera app (not opened
    // inside this page first) lands here as .../student.html?p=<payload> —
    // see routes/sessions.js current-qr. If nobody's signed in yet, carry
    // that payload through the login round-trip instead of losing it.
    const qrPayload = new URLSearchParams(location.search).get('p');
    const auth = getAuth();
    if (!auth) {
      const next = qrPayload ? `student.html?p=${encodeURIComponent(qrPayload)}` : 'student.html';
      location.href = `index.html?next=${encodeURIComponent(next)}`;
    }
    if (auth) {
      const adminLinks = auth.role === 'admin'
        ? ' · <a href="teacher.html" style="color:var(--accent);">Teacher page</a> · <a href="history.html" style="color:var(--accent);">History</a>'
        : '';
      document.getElementById('signed-in-as').innerHTML =
        `Signed in as ${auth.name} (${auth.email}) — <a href="#" id="sign-out-link" style="color:var(--text-dim);">sign out</a>${adminLinks}`;
      document.getElementById('sign-out-link').onclick = (e) => { e.preventDefault(); signOut(); };
    }

    // Client-side heads-up only — a matching check on the server (see
    // routes/attendance.js isAllowedBrowser) is what actually enforces this.
    // iOS: Safari or Chrome (CriOS) only — both are Safari's own WebKit
    // engine underneath either way, but capping to the two browsers people
    // actually have keeps the number of apps to switch between small.
    // Android: only real Chrome — Samsung Internet/Edge/Opera/etc also say
    // "Chrome" in their UA but differ enough to exclude.
    function isAllowedBrowser() {
      const ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua)) return /Safari/.test(ua) && !/FxiOS|EdgiOS|OPiOS|UCBrowser/.test(ua);
      return /Chrome/.test(ua) && !/SamsungBrowser|Edg|OPR\/|Firefox|UCBrowser|MiuiBrowser/.test(ua);
    }
    if (auth && auth.role !== 'admin' && !isAllowedBrowser()) {
      document.querySelector('.card').innerHTML =
        '<p class="msg err">Please use Chrome (Android) or Safari/Chrome (iPhone) to mark attendance.</p>';
    }

    // Device id = hash(browser/hardware fingerprint + a random per-install id).
    // The fingerprint alone (user agent, screen, canvas) is IDENTICAL for every
    // phone of the same model/OS, so two honest classmates with the same iPhone
    // would collide and one could never mark attendance. The random install id
    // (kept in localStorage AND a long-lived cookie, so clearing one doesn't
    // reset it) makes each phone distinct; the fingerprint still keeps it tied
    // to this kind of device.
    // ponytail: still client-side — clearing all site data, or a private window,
    // gives a new install id. That only ever LOCKS the student's own account
    // (staff reset fixes it); it can't unlock someone else's, because their
    // binding lives on the server. Real hardware binding needs a native app.
    function getInstallId() {
      let id = null;
      try { id = localStorage.getItem('install_id'); } catch {}
      if (!id) {
        const m = document.cookie.match(/(?:^|; )install_id=([^;]+)/);
        if (m) id = m[1];
      }
      if (!id) id = crypto.randomUUID();
      try { localStorage.setItem('install_id', id); } catch {}
      document.cookie = 'install_id=' + id + '; max-age=' + 60 * 60 * 24 * 400 + '; path=/; SameSite=Lax';
      return id;
    }

    async function getDeviceId() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('device-fingerprint', 2, 2);
      const canvasData = canvas.toDataURL();

      const raw = [
        navigator.userAgent,
        navigator.hardwareConcurrency,
        navigator.language,
        screen.width, screen.height, screen.colorDepth,
        Intl.DateTimeFormat().resolvedOptions().timeZone,
        canvasData,
        getInstallId(),
      ].join('|');

      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    let scanner = null;

    let busyBtnId = 'scan-btn';
    const busyBtnLabel = { 'scan-btn': 'Scan classroom QR', 'code-submit-btn': 'Submit code' };
    function setBusy(busy, label) {
      const btn = document.getElementById(busyBtnId);
      btn.disabled = busy;
      btn.innerHTML = busy ? `<span class="spinner"></span>${label}` : busyBtnLabel[busyBtnId];
    }

    document.getElementById('code-toggle-link').onclick = (e) => {
      e.preventDefault();
      const entry = document.getElementById('code-entry');
      const isHidden = entry.style.display === 'none';
      entry.style.display = isHidden ? 'block' : 'none';
      e.target.textContent = isHidden ? 'Scan the QR instead' : "Can't scan the QR? Enter the code instead";
    };

    document.getElementById('code-submit-btn').onclick = () => {
      const rollNo = document.getElementById('rollNo').value.trim();
      if (!rollNo) { showMsg('Enter your roll number first.', false); return; }
      if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24 followed by 7 digits (e.g. 240701424).', false); return; }

      const code = document.getElementById('liveCode').value.trim();
      if (!code) { showMsg('Enter the live code shown on the teacher\'s screen.', false); return; }

      busyBtnId = 'code-submit-btn';
      document.getElementById('result').innerHTML = '';
      handleScan({ code }, rollNo);
    };

    // Keep in sync with the server-side check in routes/attendance.js (search
    // "Wrong roll number format") — this is just a fast client-side pre-check,
    // the server enforces the real rule.
    function validRollNo(rollNo) {
      if (auth && auth.role === 'admin') return true; // admin uses arbitrary test values
      return /^24\d{7}$/.test(rollNo);
    }

    // Named (not anonymous) so the qrPayload direct-mark flow below can
    // switch back to it if that captured token turns out to have expired —
    // that payload is dead at that point, only a real fresh scan works.
    function openCameraScan() {
      const rollNo = document.getElementById('rollNo').value.trim();
      if (!rollNo) { showMsg('Enter your roll number first.', false); return; }
      if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24 followed by 7 digits (e.g. 240701424).', false); return; }

      busyBtnId = 'scan-btn';
      setBusy(true, 'Opening camera...');
      document.getElementById('reader-frame').style.display = 'block';
      document.getElementById('result').innerHTML = '';

      scanner = new Html5Qrcode('reader');
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },
        async (decodedText) => {
          await scanner.stop();
          scanner.clear();
          document.getElementById('reader-frame').style.display = 'none';
          handleScan({ payload: extractPayload(decodedText) }, rollNo);
        },
        () => {} // ignore per-frame scan failures
      ).catch((err) => {
        document.getElementById('reader-frame').style.display = 'none';
        showMsg('Could not access camera: ' + (err && err.message ? err.message : err), false);
        setBusy(false);
      });
    }
    document.getElementById('scan-btn').onclick = openCameraScan;

    // The QR now encodes a full student.html?p=<payload> URL (so a phone's
    // stock camera app can open it directly). The in-app camera scanner
    // decodes that same URL, so pull the payload back out of it here;
    // falls back to treating the text as a raw payload for older QR images.
    function extractPayload(text) {
      try {
        const url = new URL(text);
        const p = url.searchParams.get('p');
        if (p) return p;
      } catch {}
      return text;
    }

    function showMsg(text, ok) {
      const div = document.getElementById('result');
      const box = document.createElement('div');
      box.className = 'msg ' + (ok ? 'ok' : 'err');
      box.textContent = text; // never innerHTML: some messages can echo server/user text
      div.replaceChildren(box);
    }

    // The captured token (from a direct camera-app link) can still expire if
    // login/GPS took long enough — that specific payload is now dead, so the
    // only real fix is a genuinely fresh scan, not resubmitting it. Puts a
    // real "Scan again" button right where the error is, instead of leaving
    // the student stuck on a "Mark present" button that will just fail again.
    function showExpiredMsg() {
      const div = document.getElementById('result');
      const box = document.createElement('div');
      box.className = 'msg err';
      box.textContent = 'That QR expired while signing in. ';
      const btn = document.createElement('button');
      btn.textContent = 'Scan again';
      btn.style.cssText = 'width:auto; margin:6px 0 0; padding:6px 14px; font-size:.85rem;';
      btn.onclick = openCameraScan;
      div.replaceChildren(box, btn);
      const scanBtn = document.getElementById('scan-btn');
      scanBtn.textContent = 'Scan classroom QR';
      busyBtnLabel['scan-btn'] = 'Scan classroom QR';
      scanBtn.onclick = openCameraScan;
    }

    // A roll number typo only gets one free silent auto-correction server-side
    // (see routes/attendance.js) — after that it's locked and needs staff to
    // release it. Catching the typo here, before it ever reaches the server,
    // means an honest mistake doesn't burn that one free correction.
    function confirmRollChange(rollNo) {
      const lastRoll = localStorage.getItem('last_roll_no');
      if (lastRoll && lastRoll !== rollNo) {
        return confirm(`You last scanned in with roll number ${lastRoll}. Submit ${rollNo} instead?\n\nOnly pick "OK" if ${lastRoll} was a typo — you only get one free correction, after that a staff member has to release it.`);
      }
      return true;
    }

    function handleScan(identity, rollNo) {
      if (!confirmRollChange(rollNo)) { setBusy(false); return; }
      if (!navigator.geolocation) { showMsg('Geolocation not supported on this device.', false); setBusy(false); return; }

      setBusy(true, 'Getting GPS fix...');
      getFilteredPosition((acc) => setBusy(true, `Refining GPS fix (~${Math.round(acc)}m)...`))
        .then(async (pos) => {
          setBusy(true, `Verifying (GPS accuracy ~${Math.round(pos.accuracy)}m)...`);
          const body = {
            ...identity,
            rollNo,
            lat: pos.lat,
            lng: pos.lng,
            accuracy: pos.accuracy,
            deviceId: await getDeviceId(),
          };
          const res = await authFetch('/api/attendance/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          setBusy(false);
          if (res.ok) {
            localStorage.setItem('last_roll_no', rollNo);
            const note = data.borderline
              ? ' — near the edge of the detection radius, flagged for teacher review.'
              : '.';
            showMsg(`✓ Marked present — ~${data.distanceMeters}m from classroom center (GPS accuracy ~${Math.round(data.accuracyMeters)}m)${note}`, true);
          } else if (/expired/i.test(data.error || '')) {
            showExpiredMsg();
          } else {
            showMsg(data.error, false);
          }
        })
        .catch((err) => {
          // err.code === 1 is GeolocationPositionError.PERMISSION_DENIED —
          // only that specific case is actually about permission. Labeling
          // every failure (weak signal, GPS momentarily unavailable, our own
          // retry budget running out) as a permission problem sends students
          // to the wrong settings screen.
          const msg = err.code === 1 ? 'Location permission is required: ' + err.message : err.message;
          showMsg(msg, false);
          setBusy(false);
        });
    }

    // Arrived from a camera-app scan (?p=...) — the QR/token is already
    // captured, so skip re-opening the camera: just need the roll number,
    // then submit directly with the payload already in hand. Prefills from
    // last time so a returning student usually just taps once.
    if (qrPayload && auth && (auth.role === 'admin' || isAllowedBrowser())) {
      history.replaceState(null, '', 'student.html');
      const rollInput = document.getElementById('rollNo');
      const lastRoll = localStorage.getItem('last_roll_no');
      if (lastRoll) rollInput.value = lastRoll;
      document.getElementById('reader-frame').style.display = 'none';
      const scanBtn = document.getElementById('scan-btn');
      scanBtn.textContent = 'Mark present';
      busyBtnLabel['scan-btn'] = 'Mark present';
      scanBtn.onclick = () => {
        const rollNo = rollInput.value.trim();
        if (!rollNo) { showMsg('Enter your roll number first.', false); return; }
        if (!validRollNo(rollNo)) { showMsg('Wrong roll number format — must be 24 followed by 7 digits (e.g. 240701424).', false); return; }
        busyBtnId = 'scan-btn';
        document.getElementById('result').innerHTML = '';
        handleScan({ payload: qrPayload }, rollNo);
      };
    }
  </script>
</body>
</html>
